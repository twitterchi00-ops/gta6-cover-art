<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Lab — GTA 6-style cover art maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>VICE COVER LAB</h1>
  <p>Turn your photo into GTA-style cover art. Pick a layout, a grade, a lettering style — export a PNG to share.</p>
</header>
<main>
  <section class="stage">
    <canvas id="preview" width="1080" height="1080"></canvas>
    <p class="hint">Click the cover to switch the panel you crop. Use the sliders to pan and zoom it.</p>
    <div id="gallery" class="gallery"></div>
  </section>
  <section class="controls">
    <label>Photo
      <input type="file" id="photoFile" accept="image/*">
    </label>
    <div class="row">
      <button id="sampleBoulevard">Sample: Boulevard</button>
      <button id="samplePier">Sample: Pier</button>
    </div>
    <label>Title <input id="title" type="text" value="Sunset Heist" maxlength="24"></label>
    <label>Subtitle <input id="subtitle" type="text" value="Vice City Stories" maxlength="32"></label>
    <div class="group"><span>Layout</span><div id="layouts" class="picks"></div></div>
    <div class="group"><span>Grade</span><div id="grades" class="picks"></div></div>
    <div class="group"><span>Lettering</span><div id="letterings" class="picks"></div></div>
    <div class="group"><span>Export size</span><div id="sizes" class="picks"></div></div>
    <div class="group">
      <span id="panelLabel">Panel 1</span>
      <label>Pan X <input id="panX" type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Pan Y <input id="panY" type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Zoom <input id="zoom" type="range" min="1" max="2" step="0.05" value="1"></label>
      <button id="nextPanel">Next panel</button>
    </div>
    <button id="exportBtn" class="export">Export PNG</button>
  </section>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
