<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Lab — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="stage">
    <canvas id="stage" width="1080" height="1080" aria-label="Cover preview — click a panel to select it, drag to crop, scroll to zoom"></canvas>
    <p class="hint">Click a panel to select it · drag its photo to crop · scroll to zoom · arrow keys nudge</p>
  </section>
  <aside class="panel" aria-label="Cover controls">
    <h1>Vice Cover Lab</h1>
    <p class="tagline">Your photo + a caption, turned into GTA-poster-style cover art. Photos never leave this machine.</p>

    <fieldset>
      <legend>1 · Photos</legend>
      <label class="file">Add photos <input id="photo" type="file" accept="image/*" multiple></label>
      <div class="row">
        <button id="samples" type="button">Use sample photos</button>
        <button id="clearPanel" type="button">Clear panel</button>
      </div>
      <p class="panel-info"><span id="panelInfo">Panel 1 of 3</span></p>
      <label>Zoom <span id="zoomReadout">100%</span>
        <input id="zoom" type="range" min="100" max="400" value="100" step="5">
      </label>
      <button id="resetCrop" type="button">Reset crop</button>
    </fieldset>

    <fieldset>
      <legend>2 · Layout</legend>
      <div id="layouts" class="layout-grid" role="group" aria-label="Panel layout"></div>
    </fieldset>

    <fieldset>
      <legend>3 · Colour grade</legend>
      <div id="grades" class="grade-row" role="group" aria-label="Colour grade"></div>
      <p class="grade-name" id="gradeName"></p>
    </fieldset>

    <fieldset>
      <legend>4 · Caption</legend>
      <label>Title <input id="title" type="text" maxlength="48" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="60" value="A Vice City story"></label>
      <label>Tag <input id="tag" type="text" maxlength="24" value="Vice City"></label>
      <div id="lettering" class="opt-row" role="group" aria-label="Lettering style"></div>
      <div class="checks">
        <label><input id="sunburst" type="checkbox" checked> Sunburst</label>
        <label><input id="halftone" type="checkbox" checked> Halftone</label>
        <label><input id="grain" type="checkbox" checked> Grain</label>
        <label><input id="frame" type="checkbox" checked> Frame</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>5 · Export</legend>
      <div id="sizes" class="opt-row" role="group" aria-label="Export size"></div>
      <button id="surprise" type="button">🎲 Surprise me</button>
      <button id="export" type="button" class="export">⬇ Export PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
  </aside>
</main>
<pre id="testReport" style="display:none"></pre>
<script src="./src/cover.js"></script>
<script src="./src/shots.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
